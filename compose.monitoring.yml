# Lokalny Langfuse v4; układ usług według oficjalnego Docker Compose.
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://postgres:${LF_DB_PASSWORD:?Uruchom scripts/configure_monitoring.py}@lf-postgres:5432/postgres
  SALT: ${LF_SALT:?Brak LF_SALT}
  ENCRYPTION_KEY: ${LF_ENCRYPTION_KEY:?Brak LF_ENCRYPTION_KEY}
  NEXTAUTH_URL: http://localhost:3000
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_URL: http://lf-clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://lf-clickhouse:9000
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?Brak LF_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: lf-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LF_REDIS_PASSWORD:?Brak LF_REDIS_PASSWORD}
  REDIS_TLS_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LF_STORAGE_PASSWORD:?Brak LF_STORAGE_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://lf-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LF_STORAGE_PASSWORD:?Brak LF_STORAGE_PASSWORD}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
  LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://lf-minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
x-langfuse-dependencies: &dependencies
  lf-postgres:
    condition: service_healthy
  lf-clickhouse:
    condition: service_healthy
  lf-redis:
    condition: service_healthy
  lf-minio:
    condition: service_healthy
services:
  api:
    environment:
      MAIL_AGENT_LANGFUSE_ENABLED: "true"
      MAIL_AGENT_LANGFUSE_URL: http://langfuse-web:3000
      MAIL_AGENT_LANGFUSE_PUBLIC_KEY: ${LF_PUBLIC_KEY:?Brak LF_PUBLIC_KEY}
      MAIL_AGENT_LANGFUSE_SECRET_KEY: ${LF_SECRET_KEY:?Brak LF_SECRET_KEY}
      # Profil demonstracyjny: wyłącznie zgłoszenia syntetyczne.
      MAIL_AGENT_LANGFUSE_CAPTURE_CONTENT: "true"
  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4@sha256:48ecae32cd74d3a567588602c144de0ec626daf32dc5f2e831a03cebd0bb2d34
    depends_on: *dependencies
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LF_AUTH_SECRET:?Brak LF_AUTH_SECRET}
      LANGFUSE_INIT_ORG_ID: mail-agent-local
      LANGFUSE_INIT_ORG_NAME: Mail Agent
      LANGFUSE_INIT_PROJECT_ID: mail-agent-poc
      LANGFUSE_INIT_PROJECT_NAME: Mail Agent PoC
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LF_PUBLIC_KEY:?Brak LF_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LF_SECRET_KEY:?Brak LF_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: operator@example.com
      LANGFUSE_INIT_USER_NAME: Operator
      LANGFUSE_INIT_USER_PASSWORD: ${LF_ADMIN_PASSWORD:?Brak LF_ADMIN_PASSWORD}
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4@sha256:246a3a0fab57810734080d302492aa99d7ed0b6acc909c84b58832074b564175
    depends_on: *dependencies
    environment: *langfuse-env
  lf-postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${LF_DB_PASSWORD:?Brak LF_DB_PASSWORD}
    volumes:
      - lf-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
  lf-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    user: "101:101"
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LF_CLICKHOUSE_PASSWORD:?Brak LF_CLICKHOUSE_PASSWORD}
    volumes:
      - lf-clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  lf-redis:
    image: redis:7
    environment:
      REDISCLI_AUTH: ${LF_REDIS_PASSWORD:?Brak LF_REDIS_PASSWORD}
    command: ["redis-server", "--requirepass", "${LF_REDIS_PASSWORD:?Brak LF_REDIS_PASSWORD}", "--maxmemory-policy", "noeviction"]
    volumes:
      - lf-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  lf-minio:
    image: cgr.dev/chainguard/minio
    entrypoint: sh
    command: ["-c", "mkdir -p /data/langfuse && minio server --address :9000 /data"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LF_STORAGE_PASSWORD:?Brak LF_STORAGE_PASSWORD}
    ports:
      - "127.0.0.1:9090:9000"
    volumes:
      - lf-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  lf-postgres:
  lf-clickhouse:
  lf-redis:
  lf-minio:
