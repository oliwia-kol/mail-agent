[project]
name = "mail-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain-ollama",
    "pydantic-settings",
    "email-validator",
    "httpx",
    "langfuse>=5.0.1",
]

[dependency-groups]
dev = ["pytest", "ruff", "aiosmtpd"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
